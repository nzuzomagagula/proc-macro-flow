[workspace]
members = ["proc_macro_flow_derive", "proc_macro_flow_traits"]

[package]
name = "proc_macro_flow"
version = "0.1.0"
edition = "2024"

[dependencies]
proc_macro_flow_derive = { path = "proc_macro_flow_derive" }
proc_macro_flow_traits = { path = "proc_macro_flow_traits" }

[dev-dependencies]
# only the derive tests need these; the facade itself re-exports rather than uses them
syn = { version = "3", features = ["full"] }
# quote/proc-macro2 deliberately ABSENT - generated code must not need them
