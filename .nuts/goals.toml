# nuts goals - workspace root
#
# Intentionally empty. Goals live with the crate that owns the work:
#
#   proc_macro_flow_derive/.nuts/goals.toml    syntax, attribute, extractor,
#                                              processor, generator, pipeline
#   proc_macro_flow_traits/.nuts/goals.toml    pipeline, syntax
#
# Both crates are their own nuts projects. Declaring their goals up here made one
# flat list of everything in the workspace, which is exactly the view that stops
# being useful once there is more than one stage in flight - `nuts goals` should
# answer "what is this crate for", not "what exists".
#
# INTERIM: nuts resolves .nuts from the repository root regardless of the working
# directory, so until it reads child projects recursively BOTH files above are
# inert and `nuts goals` reports none - running from inside a crate does not help.
# Verified, not assumed. The per-crate files are written for the recursive nuts;
# if a working goal view is wanted before then, mirror them back here and delete
# the mirror once recursion lands.
