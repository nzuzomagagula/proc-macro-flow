<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1286px;height:956px;background:#FFFFFF;" width="1286px" height="956px" viewBox="0 0 1286 956" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="463.292" y="22.995" fill="#000" font-size="14" textLength="352.728" font-weight="700">What is actually wired, and where the gap is</text></g><!--entity Entry--><g class="entity" data-qualified-name="Entry" id="ent0001" data-source-line="6"><rect x="22.37" y="44.297" width="257.303" height="52.594" fill="#E8F4EA" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="32.37" y="67.292" fill="#000" font-size="14" textLength="107.83">lib.rs::extractor</text><text x="32.37" y="83.589" fill="#000" font-size="14" textLength="13.357">1.</text><text x="50.178" y="83.589" fill="#000" font-size="14" textLength="219.495">[proc_macro_derive(Extractor)]</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0002" data-source-line="8"><rect x="67.91" y="243.257" width="166.228" height="52.594" fill="#E8F4EA" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="77.91" y="266.252" fill="#000" font-size="14" textLength="113.661">StructExtraction</text><text x="77.91" y="282.549" fill="#000" font-size="14" textLength="146.228">&lt;&amp;'ast DeriveInput></text></g><!--entity F--><g class="entity" data-qualified-name="F" id="ent0003" data-source-line="9"><rect x="88.63" y="458.747" width="124.802" height="52.594" fill="#E8F4EA" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="98.63" y="481.742" fill="#000" font-size="14" textLength="104.802">FieldExtraction</text><text x="98.63" y="498.039" fill="#000" font-size="14" textLength="97.371">&lt;&amp;'ast Field></text></g><!--entity T--><g class="entity" data-qualified-name="T" id="ent0004" data-source-line="10"><rect x="51.62" y="613.847" width="198.808" height="52.594" fill="#FFD9D9" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="61.62" y="636.842" fill="#000" font-size="14" textLength="178.808">TransformationExtraction</text><text x="61.62" y="653.139" fill="#000" font-size="14" textLength="126.103">&lt;&amp;'ast Attribute></text></g><!--entity Y--><g class="entity" data-qualified-name="Y" id="ent0005" data-source-line="11"><rect x="498.39" y="44.297" width="235.264" height="52.594" fill="#FFF4E5" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="508.39" y="67.292" fill="#000" font-size="14" textLength="215.264">SyntaxFieldAttributeExtraction</text><text x="508.39" y="83.589" fill="#000" font-size="14" textLength="126.103">&lt;&amp;'ast Attribute></text></g><!--entity V--><g class="entity" data-qualified-name="V" id="ent0006" data-source-line="13"><rect x="1003.54" y="226.957" width="182.976" height="85.188" fill="#E8F4EA" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1013.54" y="249.952" fill="#000" font-size="14" textLength="80.623">vocab suite</text><text x="1013.54" y="266.249" fill="#000" font-size="14" textLength="162.976">flag! name_value! leaf!</text><text x="1013.54" y="282.546" fill="#000" font-size="14" textLength="136.302">meta_list! variants!</text><text x="1013.54" y="298.843" fill="#000" font-size="14" textLength="140.068">names! vocabulary!</text></g><!--entity P--><g class="entity" data-qualified-name="P" id="ent0007" data-source-line="15"><rect x="760.03" y="466.897" width="87.983" height="36.297" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="770.03" y="489.892" fill="#000" font-size="14" textLength="67.983">Processor</text></g><!--entity G--><g class="entity" data-qualified-name="G" id="ent0008" data-source-line="16"><rect x="881.48" y="621.997" width="91.094" height="36.297" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="891.48" y="644.992" fill="#000" font-size="14" textLength="71.094">Generator</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="29"><path d="M6,736.407 L6,837.204 A0,0 0 0 0 6,837.204 L296.052,837.204 A0,0 0 0 0 296.052,837.204 L296.052,746.407 L286.052,736.407 L155.03,736.407 L151.03,666.677 L147.03,736.407 L6,736.407 A0,0 0 0 0 6,736.407" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M286.052,736.407 L286.052,746.407 L296.052,746.407 L286.052,736.407" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="753.474" fill="#000" font-size="13" textLength="51.194" font-weight="700">todo!()</text><text x="67.326" y="753.474" fill="#000" font-size="13" textLength="179.271">â would panic if reached.</text><text x="12" y="768.607" fill="#000" font-size="13" textLength="259.194">Nothing reaches it. Its job has changed:</text><text x="12" y="783.739" fill="#000" font-size="13" textLength="257.563">no longer a bespoke Meta matcher, but</text><text x="12" y="798.872" fill="#000" font-size="13" textLength="269.052">"read grammar type G from an opening",</text><text x="12" y="814.005" fill="#000" font-size="13" textLength="176.408">which is PROCESSOR work.</text><text x="12" y="829.138" fill="#000" font-size="13" textLength="195.603">(#attribute/generic-grammar)</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="38"><path d="M269.09,219.157 L269.09,319.954 A0,0 0 0 0 269.09,319.954 L604.953,319.954 A0,0 0 0 0 604.953,319.954 L604.953,229.157 L594.953,219.157 L486.12,219.157 L592.62,97.337 L478.12,219.157 L269.09,219.157 A0,0 0 0 0 269.09,219.157" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M594.953,219.157 L594.953,229.157 L604.953,229.157 L594.953,219.157" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="275.09" y="236.224" fill="#000" font-size="13" textLength="263.383">Works and is tested, but driven ONLY by</text><text x="275.09" y="251.357" fill="#000" font-size="13" textLength="307.03">base/syntax/worked.rs â never by the macro</text><text x="275.09" y="266.489" fill="#000" font-size="13" textLength="234.66">path. The module carries an explicit</text><text x="275.09" y="281.622" fill="#000" font-size="13" textLength="156.533" font-family="monospace">#![allow(dead_code)]</text><text x="435.756" y="281.622" fill="#000" font-size="13" textLength="154.197">saying so, which comes</text><text x="275.09" y="296.755" fill="#000" font-size="13" textLength="188.894">off when the stages connect.</text><text x="275.09" y="311.888" fill="#000" font-size="13" textLength="135.999">(#syntax/not-driven)</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="47"><path d="M918.73,442.217 L918.73,527.881 A0,0 0 0 0 918.73,527.881 L1271.313,527.881 A0,0 0 0 0 1271.313,527.881 L1271.313,452.217 L1261.313,442.217 L1099.03,442.217 L1095.03,312.477 L1091.03,442.217 L918.73,442.217 A0,0 0 0 0 918.73,442.217" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1261.313,442.217 L1261.313,452.217 L1271.313,452.217 L1261.313,442.217" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="924.73" y="459.284" fill="#000" font-size="13" textLength="153.556" font-weight="700">Complete and green.</text><text x="1082.418" y="459.284" fill="#000" font-size="13" textLength="141.851">78 tests. Reads a real</text><text x="924.73" y="474.417" fill="#000" font-size="13" textLength="272.657">attribute into a real value, every rejection</text><text x="924.73" y="489.549" fill="#000" font-size="13" textLength="245.153">case in SCRATCH.md's table covered.</text><text x="924.73" y="504.682" fill="#000" font-size="13" textLength="331.583">Depends on nothing downstream â which is why</text><text x="924.73" y="519.815" fill="#000" font-size="13" textLength="239.973">it could land before Processor exists.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="55"><path d="M518.06,604.877 L518.06,675.408 A0,0 0 0 0 518.06,675.408 L845.995,675.408 A0,0 0 0 0 845.995,675.408 L845.995,614.877 L835.995,604.877 L713.65,604.877 L790.03,503.607 L705.65,604.877 L518.06,604.877 A0,0 0 0 0 518.06,604.877" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M835.995,604.877 L835.995,614.877 L845.995,614.877 L835.995,604.877" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="524.06" y="621.944" fill="#000" font-size="13" textLength="226.624">Comment-only stub in both crates.</text><text x="524.06" y="637.077" fill="#000" font-size="13" textLength="133.053" font-family="monospace">Extractor::Output</text><text x="661.246" y="637.077" fill="#000" font-size="13" textLength="169.749">is deliberately unbounded</text><text x="524.06" y="652.209" fill="#000" font-size="13" textLength="280.338">until this exists, because the honest bound</text><text x="524.06" y="667.342" fill="#000" font-size="13" textLength="275.349">is "whatever the processor can consume".</text></g><g class="entity" data-qualified-name="Gap" id="ent0028" data-source-line="69"><path d="M639.57,188.887 L639.57,350.215 A0,0 0 0 0 639.57,350.215 L800.03,350.215 L804.03,466.597 L808.03,350.215 L968.482,350.215 A0,0 0 0 0 968.482,350.215 L968.482,198.887 L958.482,188.887 L639.57,188.887 A0,0 0 0 0 639.57,188.887" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M958.482,188.887 L958.482,198.887 L968.482,198.887 L958.482,188.887" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="645.57" y="205.954" fill="#000" font-size="13" textLength="156.559" font-weight="700">The load-bearing gap</text><text x="645.57" y="221.087" fill="#000" font-size="13"> </text><text x="645.57" y="236.219" fill="#000" font-size="13" textLength="295.902">The extraction tree is BUILT and then nobody</text><text x="645.57" y="251.352" fill="#000" font-size="13" textLength="53.308">reads it.</text><text x="703.01" y="251.352" fill="#000" font-size="13" textLength="180.013" font-family="monospace">StructExtraction.fields</text><text x="887.155" y="251.352" fill="#000" font-size="13" textLength="24.458">and</text><text x="645.57" y="266.485" fill="#000" font-size="13" textLength="234.8" font-family="monospace">FieldExtraction.transformation</text><text x="884.502" y="266.485" fill="#000" font-size="13" textLength="68.98">each carry</text><text x="645.57" y="281.618" fill="#000" font-size="13" textLength="16.206">an</text><text x="665.908" y="281.618" fill="#000" font-size="13" textLength="148.707" font-family="monospace">#[allow(dead_code)]</text><text x="818.747" y="281.618" fill="#000" font-size="13" textLength="121.164">naming this as the</text><text x="645.57" y="296.751" fill="#000" font-size="13" textLength="48.407">reason.</text><text x="645.57" y="311.883" fill="#000" font-size="13"> </text><text x="645.57" y="327.016" fill="#000" font-size="13" textLength="282.991">lib.rs renders top-level reasons and emits a</text><text x="645.57" y="342.149" fill="#000" font-size="13" textLength="281.055">stub; the recursive walk is #syntax/render.</text></g><!--link Entry to S--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="18" data-link-type="dependency"><path d="M151.03,97.337 C151.03,135.087 151.03,200.047 151.03,237.797" style="stroke:#181818;stroke-width:1;" fill="none" id="Entry-to-S"/><polygon points="151.03,242.797,155.03,233.797,151.03,237.797,147.03,233.797,151.03,242.797" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="152.03" y="147.454" fill="#000" font-size="13" textLength="83.383">extract_from</text></g><!--link S to F--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="19" data-link-type="dependency"><path d="M151.03,296.307 C151.03,337.447 151.03,412.547 151.03,45